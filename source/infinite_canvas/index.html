		reindex();
		selection.clear();
		end_change();
		refresh_panel();
		show_toast("Canvas cleared.", true);
	}

	// ---------- keyboard ----------

	window.addEventListener("keydown", function (event) {
		const target = event.target;
		if (target && target.closest && target.closest("input, textarea, select")) return;
		/*
			A clicked sidebar button keeps keyboard focus, and the browser shows
			its focus ring as soon as a key is pressed. Shortcuts act on the
			canvas, not on that button, so drop its focus first. Tab and Enter
			are left alone for keyboard navigation.
		*/
		if (target && target.closest && target.closest(".sidebar, .picker") && event.key !== "Tab" && event.key !== "Enter")
			target.blur();
		const command = event.ctrlKey || event.metaKey;
		const key = event.key.toLowerCase();

		if (key === " ") {
			event.preventDefault();
			if (!space_down) {
				space_down = true;
				set_cursor();
			}
			return;
		}
		if (command) {
			if (key === "z") {
				event.preventDefault();
				if (event.shiftKey) redo();
				else undo();
			}
			else if (key === "y") {
				event.preventDefault();
				redo();
			}
			else if (key === "s") {
				event.preventDefault();
				save_file();
			}
			else if (key === "a") {
				event.preventDefault();
				select_all();
			}
			else if (key === "d") {
				event.preventDefault();
				duplicate();
			}
			else if (key === "c") copy_selection();
			else if (key === "x") {
				if (copy_selection()) delete_selection();
			}
			else if (key === "v") paste(snap_on ? snap_size * 2 : 20);
			else if (key === "0") {
				event.preventDefault();
				zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1 / view.zoom);
			}
			return;
		}
		if (event.altKey) return;

		if (key === "delete" || key === "backspace") {
			event.preventDefault();
			delete_selection();
		}
		else if (key === "escape") {
			if (action) abort_action();
			close_picker();
			selection.clear();
			refresh_panel();
			invalidate();
		}
		else if (key === "enter") {
			const one = single_selected();
			if (!one || one.type === "frame") return;
			event.preventDefault();
			if (one.type === "text") open_editor(one, "text");
			else if (labelled_types.has(one.type)) open_editor(one, "label");
		}
		else if (event.shiftKey && event.code === "Digit1") fit_view();
		else if (key === "+" || key === "=") zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1.2);
		else if (key === "-" || key === "_") zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1 / 1.2);
		else if (key === "]") reorder(true);
		else if (key === "[") reorder(false);
		else if (key === "g") toggle_snap();
		else if (key.startsWith("arrow")) {
			event.preventDefault();
			const step = snap_on ? snap_size : event.shiftKey ? 10 : 1;
			const moves = { arrowleft: [-step, 0], arrowright: [step, 0], arrowup: [0, -step], arrowdown: [0, step] };
			nudge(moves[key][0], moves[key][1]);
		}
		else {
			const match = tools.find(function (item) { return item.key === key; });
			if (!match) return;
			event.preventDefault();
			activate_tool(match.id);
		}
	});

	window.addEventListener("keyup", function (event) {
		if (event.key !== " ") return;
		space_down = false;
		set_cursor();
	});

	window.addEventListener("blur", function () {
		space_down = false;
	});

	// ---------- chrome ----------

	const sidebar = document.getElementById("sidebar");
	const tool_grid = document.getElementById("tool_grid");
	const picker = document.getElementById("picker");
	const picker_grid = document.getElementById("picker_grid");
	const picker_search = document.getElementById("picker_search");
	const zoom_label = document.getElementById("zoom_label");
	const undo_button = document.getElementById("undo_button");
	const redo_button = document.getElementById("redo_button");
	const snap_button = document.getElementById("snap_button");
	const empty = document.getElementById("empty");
	const tool_buttons = new Map();

	for (const item of tools) {
		const button = document.createElement("button");
		button.type = "button";
		button.title = item.label + " (" + item.key.toUpperCase() + ")";
		button.setAttribute("aria-label", item.label);
		button.innerHTML = glyph_svg(item) + "<kbd>" + item.key.toUpperCase() + "</kbd>";
		button.addEventListener("click", function () { activate_tool(item.id); });
		tool_grid.append(button);
		tool_buttons.set(item.id, button);
	}

	function activate_tool(id) {
		if (id === "icon") {
			if (picker.hidden) open_picker();
			else close_picker();
			return;
		}
		close_picker();
		set_tool(id);
	}

	function set_tool(id, keep_selection) {
		if (editing) commit_editor();
		tool = id;
		if (!keep_selection && id !== "select") selection.clear();
		hover = null;
		sync_tool_buttons();
		set_cursor();
		refresh_panel();
		invalidate();
	}

	function sync_tool_buttons() {
		for (const [id, button] of tool_buttons) {
			const on = id === tool;
			button.classList.toggle("on", on);
			button.setAttribute("aria-pressed", String(on));
		}
	}

	function toggle_snap() {
		snap_on = !snap_on;
		snap_button.classList.toggle("on", snap_on);
		snap_button.setAttribute("aria-pressed", String(snap_on));
	}

	function update_chrome() {
		zoom_label.textContent = Math.round(view.zoom * 100) + "%";
		empty.hidden = elements.length > 0 || Boolean(action);
		undo_button.disabled = !undo_stack.length;
		redo_button.disabled = !redo_stack.length;
	}

	// icon picker

	function glyph_svg(icon) {
		let markup = "<svg class=\"glyph\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path class=\"fill\" d=\"" + icon.fill + "\"/>";
		if (icon.line) markup += "<path class=\"line\" style=\"stroke-width: " + (icon.line_width || 2) + "\" d=\"" + icon.line + "\"/>";
		if (icon.cut) markup += "<path class=\"cut\" style=\"stroke-width: " + (icon.cut_width || 1.6) + "\" d=\"" + icon.cut + "\"/>";
		return markup + "</svg>";
	}

	function build_picker() {
		const query = picker_search.value.trim().toLowerCase();
		picker_grid.innerHTML = "";
		for (const name in icons) {
			const label = icons[name].label;
			if (query && !label.toLowerCase().includes(query) && !name.includes(query)) continue;
			const button = document.createElement("button");
			button.type = "button";
			button.className = name === current_icon && tool === "icon" ? "on" : "";
			button.innerHTML = glyph_svg(icons[name]) + "<span></span>";
			button.lastChild.textContent = label;
			button.addEventListener("click", function () {
				current_icon = name;
				close_picker();
				set_tool("icon");
			});
			picker_grid.append(button);
		}
	}

	function open_picker() {
		picker_search.value = "";
		build_picker();
		picker.hidden = false;
		tool_buttons.get("icon").classList.add("on");
		if (!matchMedia("(pointer: coarse)").matches) picker_search.focus();
	}

	function close_picker() {
		if (picker.hidden) return;
		picker.hidden = true;
		sync_tool_buttons();
	}

	picker_search.addEventListener("input", build_picker);
	picker_search.addEventListener("keydown", function (event) {
		if (event.key === "Escape") close_picker();
		if (event.key !== "Enter") return;
		const first = picker_grid.querySelector("button");
		if (first) first.click();
	});

	// style panel

	const panel_rows = {
		widths: { key: "width", options: [[0, "Thin"], [1, "Medium"], [2, "Thick"]] },
		dashes: { key: "dash", options: [[false, "Solid"], [true, "Dashed"]] },
		routings: { key: "routing", options: [["straight", "Straight"], ["elbow", "Elbow"]] },
		heads: { key: "heads", options: [["none", "None"], ["end", "End"], ["both", "Both"]] },
		fonts: { key: "font", options: [[0, "S"], [1, "M"], [2, "L"], [3, "XL"]] }
	};
	const panel_buttons = [];

	for (const color of colors) {
		const button = document.createElement("button");
		button.type = "button";
		button.className = "swatch";
		button.style.background = color;
		button.setAttribute("aria-label", "Color " + color);
		button.addEventListener("click", function () { set_style("color", color); });
		document.getElementById("swatches").append(button);
		panel_buttons.push({ key: "color", value: color, button: button });
	}

	for (const row in panel_rows) {
		const spec = panel_rows[row];
		for (const option of spec.options) {
			const button = document.createElement("button");
			button.type = "button";
			if (spec.key === "width") {
				button.setAttribute("aria-label", option[1]);
				const weight = document.createElement("span");
				weight.className = "weight";
				weight.style.height = [1.5, 3, 5][option[0]] + "px";
				button.append(weight);
			}
			else button.textContent = option[1];
			button.addEventListener("click", function () { set_style(spec.key, option[0]); });
			document.getElementById(row).append(button);
			panel_buttons.push({ key: spec.key, value: option[0], button: button });
		}
	}

	const panel_sections = {
		stroke: ["color", "width"],
		connector: ["color", "width", "dash", "routing", "heads"],
		text: ["color", "font"],
		icon: ["color"]
	};

	function selection_types() {
		const types = new Set();
		for (const id of selection) {
			const element = index.get(id);
			if (element) types.add(element.type);
		}
		return types;
	}

	function current_value(key) {
		const first = selection.size ? index.get(selection.values().next().value) : null;
		if (!first) return style[key];
		if (key === "width") {
			if (first.type === "stroke") return pen_sizes.indexOf(first.size);
			return first.width !== undefined ? line_widths.indexOf(first.width) : style.width;
		}
		if (key === "font") return first.font_size !== undefined ? font_sizes.indexOf(first.font_size) : style.font;
		return first[key] !== undefined ? first[key] : style[key];
	}

	/*
		With nothing selected, every style control is live: it sets the default
		for the next thing you draw. With a selection, only the controls that
		affect the selected elements stay live; the rest dim in place.
	*/
	function refresh_panel() {
		const live = new Set();
		if (selection.size)
			for (const type of selection_types()) for (const section of panel_sections[type] || []) live.add(section);
		else
			for (const section of ["color", "width", "font", "dash", "routing", "heads"]) live.add(section);
		const frame = selected_frame();
		if (frame) live.add("name");
		if (document.activeElement !== surface_name) surface_name.value = frame ? frame.name || "" : "";
		for (const field of sidebar.querySelectorAll(".field")) {
			const on = live.has(field.getAttribute("data_section"));
			field.classList.toggle("off", !on);
			for (const control of field.querySelectorAll("button, input")) control.disabled = !on;
		}
		for (const entry of panel_buttons) {
			const on = current_value(entry.key) === entry.value;
			entry.button.classList.toggle("on", on);
			entry.button.setAttribute("aria-pressed", String(on));
		}
	}

	function set_style(key, value) {
		style[key] = value;
		if (selection.size) {
			begin_change();
			for (const id of selection) {
				const element = index.get(id);
				if (!element) continue;
				if (key === "color" && element.color !== undefined) edit(id).color = value;
				else if (key === "width" && element.type === "stroke") edit(id).size = pen_sizes[value];
				else if (key === "width" && element.width !== undefined) edit(id).width = line_widths[value];
				else if (key === "font" && element.type === "text") {
					const copy = edit(id);
					copy.font_size = font_sizes[value];
					const measured = measure_text(copy.text, copy.font_size);
					copy.w = measured.w;
					copy.h = measured.h;
				}
				else if (key !== "color" && key !== "width" && key !== "font" && element[key] !== undefined) edit(id)[key] = value;
			}
			end_change();
		}
		refresh_panel();
		set_cursor();
		invalidate();
	}

	// surface name

	/*
		The name field edits live, so the title on the canvas updates as you
		type. The whole edit is one undo step: opened on focus, closed on blur.
	*/
	const surface_name = document.getElementById("surface_name");
	let naming = null;

	function selected_frame() {
		const one = single_selected();
		return one && one.type === "frame" ? one : null;
	}

	surface_name.addEventListener("focus", function () {
		const frame = selected_frame();
		if (!frame) return;
		begin_change();
		naming = { id: frame.id, original: frame.name || "" };
	});

	surface_name.addEventListener("input", function () {
		if (!naming || !index.has(naming.id)) return;
		edit(naming.id).name = surface_name.value;
		invalidate();
	});

	surface_name.addEventListener("keydown", function (event) {
		if (event.key === "Enter") surface_name.blur();
		if (event.key !== "Escape") return;
		if (naming) surface_name.value = naming.original;
		surface_name.blur();
	});

	surface_name.addEventListener("blur", function () {
		if (!naming) return;
		const session = naming;
		naming = null;
		const value = surface_name.value.trim() || session.original || "Surface";
		if (!index.has(session.id) || value === session.original) {
			cancel_change();
			refresh_panel();
			return;
		}
		edit(session.id).name = value;
		end_change();
		refresh_panel();
	});

	// collapse

	const collapse_button = document.getElementById("collapse_button");

	function set_collapsed(collapsed) {
		document.body.classList.toggle("collapsed", collapsed);
		collapse_button.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
		collapse_button.title = collapse_button.getAttribute("aria-label");
		try { localStorage.setItem(storage_key + ".collapsed", collapsed ? "1" : ""); } catch (error) {}
	}

	collapse_button.addEventListener("click", function () {
		set_collapsed(!document.body.classList.contains("collapsed"));
	});

	try { set_collapsed(localStorage.getItem(storage_key + ".collapsed") === "1"); } catch (error) {}

	// view and file actions

	undo_button.addEventListener("click", undo);
	redo_button.addEventListener("click", redo);
	document.getElementById("zoom_in").addEventListener("click", function () { zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1.2); });
	document.getElementById("zoom_out").addEventListener("click", function () { zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1 / 1.2); });
	zoom_label.addEventListener("click", function () { zoom_at({ x: screen_width / 2, y: screen_height / 2 }, 1 / view.zoom); });
	document.getElementById("fit_button").addEventListener("click", fit_view);
	snap_button.addEventListener("click", toggle_snap);
	document.getElementById("clear_button").addEventListener("click", clear_canvas);
	document.getElementById("save_button").addEventListener("click", save_file);
	document.getElementById("png_button").addEventListener("click", export_png);
	document.getElementById("open_button").addEventListener("click", function () { document.getElementById("file_input").click(); });
	document.getElementById("file_input").addEventListener("change", function (event) {
		const file = event.target.files[0];
		event.target.value = "";
		if (file) open_file(file);
	});

	// toast

	const toast = document.getElementById("toast");
	const toast_undo = document.getElementById("toast_undo");
	let toast_timer = null;

	function show_toast(message, with_undo) {
		document.getElementById("toast_message").textContent = message;
		toast_undo.hidden = !with_undo;
		toast.hidden = false;
		clearTimeout(toast_timer);
		toast_timer = setTimeout(function () { toast.hidden = true; }, with_undo ? 6000 : 2600);
	}

	toast_undo.addEventListener("click", function () {
		toast.hidden = true;
		undo();
	});

	// ---------- files and storage ----------

	const known_types = new Set(["stroke", "frame", "icon", "text", "connector"]);
	let save_timer = null;
	let save_warned = false;

	function is_number(value) {
		return typeof value === "number" && Number.isFinite(value);
	}

	function valid_element(element) {
		if (!element || typeof element.id !== "string" || !known_types.has(element.type)) return false;
		if (element.type === "connector") return Boolean(element.start && element.end);
		if (element.type === "stroke" && (!Array.isArray(element.points) || element.points.length % 3 !== 0 || !element.points.length)) return false;
		return is_number(element.x) && is_number(element.y) && is_number(element.w) && is_number(element.h);
	}

	function serialize(with_view) {
		const data = { app: "web_tools/infinite_canvas", version: 1, elements: elements };
		if (with_view) data.view = { x: view.x, y: view.y, zoom: view.zoom };
		return data;
	}

	function read_data(data) {
		if (!data || !Array.isArray(data.elements)) return null;
		return data.elements.filter(valid_element);
	}

	function schedule_save() {
		clearTimeout(save_timer);
		save_timer = setTimeout(save_local, 400);
	}

	function save_local() {
		clearTimeout(save_timer);
		try {
			localStorage.setItem(storage_key, JSON.stringify(serialize(true)));
		}
		catch (error) {
			if (save_warned) return;
			save_warned = true;
			show_toast("Autosave failed: browser storage is full. Use Save to keep a copy.", false);
		}
	}

	function load_local() {
		try {
			const data = JSON.parse(localStorage.getItem(storage_key) || "null");
			const list = read_data(data);
			if (!list) return false;
			elements = list;
			reindex();
			if (data.view && is_number(data.view.x) && is_number(data.view.y) && is_number(data.view.zoom)) {
				view.x = data.view.x;
				view.y = data.view.y;
				view.zoom = clamp_zoom(data.view.zoom);
				return "view";
			}
			return true;
		}
		catch (error) {
			return false;
		}
	}

	function stamp() {
		return new Date().toISOString().slice(0, 10);
	}

	function download(blob, name) {
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.href = url;
		link.download = name;
		document.body.append(link);
		link.click();
		link.remove();
		setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
	}

	function save_file() {
		finish_everything();
		download(new Blob([JSON.stringify(serialize(false))], { type: "application/json" }), "canvas_" + stamp() + ".json");
	}

	function open_file(file) {
		file.text().then(function (text) {
			let list = null;
			try {
				list = read_data(JSON.parse(text));
			}
			catch (error) {
				list = null;
			}
			if (!list) {
				show_toast("That file is not a saved canvas. Open a .json made with Save.", false);
				return;
			}
			finish_everything();
			begin_change();
			elements = list;
			reindex();
			selection.clear();
			end_change();
			refresh_panel();
			fit_view();
			show_toast("Opened " + file.name + ".", true);
		});
	}

	function export_png() {
		finish_everything();
		const ids = selection.size ? with_children(selection) : null;
		const list = ids ? elements.filter(function (element) { return ids.has(element.id); }) : elements;
		const box = union(list.map(box_of));
		if (!box) {
			show_toast("Nothing to export yet.", false);
			return;
		}
		const pad = 32, title_room = 24;
		const width = box.w + pad * 2, height = box.h + pad * 2 + title_room;
		const scale = Math.min(2, 8000 / Math.max(width, height));
		const canvas = document.createElement("canvas");
		canvas.width = Math.ceil(width * scale);
		canvas.height = Math.ceil(height * scale);
		const kept = new Set(selection);
		selection.clear();
		draw_scene(canvas.getContext("2d"), { x: pad - box.x, y: pad + title_room - box.y, zoom: 1, ratio: scale, width: width, height: height }, ids, well_color);
		for (const id of kept) selection.add(id);
		canvas.toBlob(function (blob) {
			if (blob) download(blob, "canvas_" + stamp() + ".png");
		}, "image/png");
	}

	window.addEventListener("pagehide", save_local);
	document.addEventListener("visibilitychange", function () {
		if (document.visibilityState === "hidden") save_local();
	});

	// ---------- start ----------

	// When the sidebar collapses or expands, shift the camera so drawings stay put on screen.
	let measured = false;
	function measure_viewport() {
		const rect = viewport.getBoundingClientRect();
		if (measured) {
			view.x += viewport_left - rect.left;
			view.y += viewport_top - rect.top;
		}
		measured = true;
		viewport_left = rect.left;
		viewport_top = rect.top;
		resize();
	}

	const restored = load_local();
	measure_viewport();
	new ResizeObserver(measure_viewport).observe(viewport);
	window.addEventListener("resize", measure_viewport);
	if (restored !== "view") {
		view.x = screen_width / 2;
		view.y = screen_height / 2;
	}
	set_tool(tool);
</script>
