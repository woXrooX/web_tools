<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON beautifier</title>

<link rel="icon" href="../../images/Favicon/logo.ico" sizes="32x32">
<link rel="icon" href="../../images/Favicon/logo_96x96.png" type="image/png" sizes="96x96">
<link rel="icon" href="../../images/Favicon/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../images/Favicon/logo_180x180.png">
<link rel="manifest" href="../../images/Favicon/site.webmanifest">
<meta name="theme-color" content="#0e0f12">

<link rel="stylesheet" href="../../styles/core.css">
<style>
	/* Layout only. Colour and type come from ../../styles/core.css.
	   --indent and --numbers are also rewritten at runtime. */
	:root {
		--indent: 4ch;
		--gutter: 20px;
		--numbers: 4ch;
		--head: 40px;
	}

	html, body {
		height: 100%;
		margin: 0;
	}

	body {
		background: var(--page);
		color: var(--ink);
		font-family: var(--sans);
		display: flex;
		flex-direction: column;
	}

	header {
		display: flex;
		flex-wrap: wrap;
		align-items: baseline;
		gap: 8px 18px;
		padding: 14px 20px;
		border-bottom: 1px solid var(--line);
	}

	h1 {
		margin: 0;
		font-family: var(--mono);
		font-size: 15px;
		font-weight: 600;
		letter-spacing: -0.01em;
	}

	.controls {
		margin-left: auto;
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		gap: 8px;
	}

	button, select {
		font-family: var(--sans);
		font-size: 13px;
		color: var(--ink);
		background: var(--surface);
		border: 1px solid var(--line);
		border-radius: 3px;
		padding: 5px 10px;
		cursor: pointer;
	}

	button:hover:not(:disabled), select:hover {
		border-color: var(--line_strong);
		background: #1e242b;
	}

	button:disabled {
		color: var(--ink_faint);
		cursor: default;
	}

	button[aria-pressed="true"] {
		color: var(--ink);
		background: #263039;
		border-color: var(--line_strong);
	}

	button:focus-visible, select:focus-visible {
		outline: 2px solid var(--ink);
		outline-offset: 1px;
	}

	label.field {
		font-size: 13px;
		color: var(--ink_soft);
		display: flex;
		align-items: center;
		gap: 6px;
	}

	.search {
		flex: 1 1 240px;
		max-width: 360px;
		display: flex;
		align-items: center;
		gap: 4px;
	}

	/* Baseline alignment lets the typed text line up with the text of the header's other controls. */
	.search_box {
		flex: 1;
		min-width: 0;
		display: flex;
		align-items: baseline;
		gap: 6px;
		padding: 0 8px;
		border: 1px solid var(--line);
		border-radius: 3px;
		background: var(--surface);
		color: var(--ink_faint);
		cursor: text;
	}

	.search_box:hover {
		border-color: var(--line_strong);
	}

	.search_box:focus-within {
		border-color: var(--line_strong);
		outline: 2px solid var(--ink);
		outline-offset: 1px;
	}

	.search_box svg {
		flex: none;
		align-self: center;
		width: 16px;
		height: 16px;
		fill: currentColor;
	}

	.search_box input {
		flex: 1;
		width: 0;
		min-width: 0;
		padding: 5px 0;
		border-radius: 0;
		background: transparent;
		font-family: var(--sans);
		font-size: 13px;
		line-height: 1.4;
	}

	.search_box input:focus {
		outline: 0;
	}

	.icon_button {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		padding: 5px 6px;
	}

	.icon_button svg {
		width: 18px;
		height: 18px;
		fill: currentColor;
	}

	/* 16px text keeps iOS from zooming in on the field, and the arrows grow to a fingertip. */
	@media (pointer: coarse) {
		.search_box input { font-size: 16px; }
		.icon_button { padding: 7px 8px; }
	}

	main {
		flex: 1;
		min-height: 0;
		display: grid;
		grid-template-columns: 1fr 1fr;
		gap: 1px;
		background: var(--line);
	}

	.pane {
		background: var(--surface);
		display: flex;
		flex-direction: column;
		min-width: 0;
		min-height: 0;
	}

	.pane_head {
		flex: none;
		height: var(--head);
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 10px;
		padding: 0 14px;
		font-size: 12px;
		color: var(--ink_soft);
		border-bottom: 1px solid var(--line);
	}

	.pane_head strong {
		color: var(--ink);
		font-weight: 600;
	}

	.pane_head .head_actions {
		display: flex;
		align-items: center;
		gap: 8px;
	}

	.pane_head button {
		font-size: 12px;
		padding: 3px 8px;
	}

	.head_title {
		flex: none;
		display: flex;
		align-items: baseline;
		gap: 10px;
	}

	.match_count {
		color: var(--ink_soft);
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
	}

	.match_count.none {
		color: var(--ink_faint);
	}

	.status.ok { color: var(--ok); }
	.status.bad { color: var(--danger); }

	textarea, .input_marks, #output_area {
		flex: 1;
		min-height: 0;
		margin: 0;
		padding: 14px;
		font-family: var(--mono);
		font-size: 13px;
		line-height: 1.55;
		tab-size: 4;
		overflow: auto;
	}

	textarea {
		border: 0;
		resize: none;
		background: transparent;
		color: var(--ink);
	}

	textarea::placeholder { color: var(--ink_faint); }

	.input_box {
		position: relative;
		flex: 1;
		min-height: 0;
		display: flex;
	}

	.input_box textarea {
		position: relative;
		min-width: 0;
	}

	/*
		Search marks for the input. This layer sits behind the transparent textarea and shares its text box rule above,
		and the script copies the browser's own textarea text settings onto it, so each mark lands under its text.
	*/
	.input_marks {
		position: absolute;
		inset: 0;
		overflow: hidden;
		white-space: pre-wrap;
		overflow-wrap: break-word;
		color: transparent;
		pointer-events: none;
		-webkit-text-size-adjust: 100%;
		text-size-adjust: 100%;
	}

	/* Lets the layer scroll as far as the textarea does, even when it holds less text. */
	.input_marks::after {
		content: "";
		display: block;
		height: 100vh;
	}

	mark {
		border-radius: 2px;
		background: var(--line_strong);
		color: inherit;
	}

	mark.current {
		background: var(--ink_faint);
		box-shadow: 0 0 0 1px var(--ink);
	}

	#output_area mark.current > * { color: var(--ink); }

	#output_area {
		color: var(--syntax_punct);
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}

	.tree_root {
		position: relative;
		padding-left: var(--numbers);
		counter-reset: line_number;
	}

	.line {
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}

	.line::before {
		counter-increment: line_number;
		content: counter(line_number);
		position: absolute;
		left: 0;
		width: calc(var(--numbers) - 1.5ch);
		text-align: right;
		color: var(--ink_faint);
		font-variant-numeric: tabular-nums;
		user-select: none;
		pointer-events: none;
	}

	.children { padding-left: var(--indent); }

	.gutter {
		display: inline-block;
		width: var(--gutter);
	}

	.fold {
		display: inline-block;
		width: calc(var(--gutter) - 3px);
		padding: 0;
		margin-right: 3px;
		border: 0;
		border-radius: 3px;
		background: transparent;
		color: var(--ink_soft);
		font-family: var(--mono);
		font-size: 15px;
		line-height: inherit;
		text-align: center;
		vertical-align: baseline;
		cursor: pointer;
	}

	.fold:hover {
		background: #232c35;
		color: var(--ink);
	}

	.fold::before { content: "\25be"; }

	.node.collapsed > .line > .fold::before { content: "\25b8"; }

	.node.collapsed > .children,
	.node.collapsed > .line.close { display: none; }

	.tail { display: none; }

	.node.collapsed > .line > .tail { display: inline; }

	.count { color: var(--ink_soft); }

	.punct { color: var(--syntax_punct); }

	.tok_key { color: var(--syntax_key); font-weight: 600; }
	.tok_string { color: var(--syntax_string); }
	.tok_number { color: var(--syntax_number); }
	.tok_bool, .tok_null { color: var(--syntax_literal); }

	.empty { color: var(--ink_faint); }

	#output_area.error_box { color: var(--danger); white-space: pre-wrap; }
	.error_box .caret { color: var(--danger); }

	.drop_active { background: #1c2530; }

	@media (max-width: 760px) {
		main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
	}
</style>
</head>
<body>

<nav class="site_bar">

<!-- Icons: Material Symbols, Rounded style, filled, by Google. Apache License 2.0: https://github.com/google/material-design-icons -->

<header>
	<h1>JSON beautifier</h1>
	<div class="search" role="search">
		<label class="search_box">
			<svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M380-320q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l224 224q11 11 11 28t-11 28q-11 11-28 11t-28-11L532-372q-30 24-69 38t-83 14Zm0-80q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
			<input type="search" id="search_field" placeholder="Search input and output" aria-label="Search input and output" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
		</label>
		<button type="button" class="icon_button" id="search_previous" aria-label="Previous match" title="Previous match (Shift + Enter)" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-528 324-372q-11 11-28 11t-28-11q-11-11-11-28t11-28l184-184q12-12 28-12t28 12l184 184q11 11 11 28t-11 28q-11 11-28 11t-28-11L480-528Z"/></svg></button>
		<button type="button" class="icon_button" id="search_next" aria-label="Next match" title="Next match (Enter)" disabled><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z"/></svg></button>
	</div>
	<div class="controls">
		<label class="field">Indent
			<select id="indent_select">
				<option value="2">2 spaces</option>
				<option value="4">4 spaces</option>
				<option value="tab" selected>Tab</option>
			</select>
		</label>
		<label class="field" title="Repair Python-style output: single quotes, True/False/None, datetime and other object reprs, tuples, trailing commas."><input type="checkbox" id="python_repair"> Python dict</label>
		<button id="sort_button" type="button">Sort keys</button>
		<button id="minify_button" type="button">Minify</button>
		<button id="sample_button">Load sample</button>
		<button id="copy_button">Copy output</button>
		<button id="clear_button">Clear</button>
	</div>
</header>

<main>
	<section class="pane" id="input_pane">
		<div class="pane_head">
			<span class="head_title"><strong>Input</strong><span class="match_count" id="input_count"></span></span>
			<span id="input_stats"></span>
		</div>
		<div class="input_box">
			<div class="input_marks" id="input_marks" aria-hidden="true"></div>
			<textarea id="input_area" spellcheck="false" placeholder="Paste JSON or a Python dict here, or drop a .json file."></textarea>
		</div>
	</section>

	<section class="pane">
		<div class="pane_head">
			<span class="head_title"><strong>Formatted</strong><span class="match_count" id="output_count"></span></span>
			<span class="head_actions">
				<button id="expand_button" type="button">Expand all</button>
				<button id="collapse_button" type="button">Collapse all</button>
				<span id="output_status" class="status"></span>
			</span>
		</div>
		<div id="output_area"><span class="empty">Output appears here as you type.</span></div>
	</section>
</main>

<script>
	const input_area = document.getElementById("input_area");
	const output_area = document.getElementById("output_area");
	const output_status = document.getElementById("output_status");
	const input_stats = document.getElementById("input_stats");
	const indent_select = document.getElementById("indent_select");
	const sort_button = document.getElementById("sort_button");
	const python_repair = document.getElementById("python_repair");
	const input_pane = document.getElementById("input_pane");
	const minify_button = document.getElementById("minify_button");
	const expand_button = document.getElementById("expand_button");
	const collapse_button = document.getElementById("collapse_button");
	const search_field = document.getElementById("search_field");
	const search_previous = document.getElementById("search_previous");
	const search_next = document.getElementById("search_next");
	const input_marks = document.getElementById("input_marks");
	const input_count = document.getElementById("input_count");
	const output_count = document.getElementById("output_count");

	const eager_budget = 4000;
	const eager_depth = 3;
	const eager_width = 200;

	let last_output = "";
	let build_credit = 0;
	let view_minified = false;
	let sort_active = false;

	// The value the formatted pane shows, after sorting. undefined while the input is empty or invalid.
	let output_value;

	function escape_html(text) {
		return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	}

	function token_class(value) {
		if (value === null) {
			return "tok_null";
		}
		if (typeof value === "string") {
			return "tok_string";
		}
		if (typeof value === "number") {
			return "tok_number";
		}
		return "tok_bool";
	}

	function span(class_name, text) {
		const element = document.createElement("span");
		element.className = class_name;
		element.textContent = text;
		return element;
	}

	function gutter() {
		return span("gutter", "");
	}

	function sort_value(value) {
		if (Array.isArray(value)) {
			return value.map(sort_value);
		}
		if (value !== null && typeof value === "object") {
			const sorted = {};
			Object.keys(value).sort().forEach(function (key) {
				sorted[key] = sort_value(value[key]);
			});
			return sorted;
		}
		return value;
	}

	function current_indent() {
		return indent_select.value === "tab" ? "\t" : Number(indent_select.value);
	}

	function apply_indent_width() {
		const width = indent_select.value === "tab" ? 4 : Number(indent_select.value);
		document.documentElement.style.setProperty("--indent", width + "ch");
	}

	function byte_size(text) {
		return new TextEncoder().encode(text).length;
	}

	function format_size(bytes) {
		if (bytes < 1024) {
			return bytes + " B";
		}
		if (bytes < 1024 * 1024) {
			return (bytes / 1024).toFixed(1) + " KB";
		}
		return (bytes / (1024 * 1024)).toFixed(1) + " MB";
	}

	function error_position(message) {
		const match = /position (\d+)/.exec(message);
		return match ? Number(match[1]) : -1;
	}

	function error_report(source, message) {
		const position = error_position(message);
		if (position < 0) {
			return escape_html(message);
		}
		const before = source.slice(0, position);
		const line_number = before.split("\n").length;
		const line_start = before.lastIndexOf("\n") + 1;
		const column = position - line_start + 1;
		let line_end = source.indexOf("\n", line_start);
		if (line_end === -1) {
			line_end = source.length;
		}
		const line_text = source.slice(line_start, line_end);
		const caret = " ".repeat(Math.max(column - 1, 0)) + "^";
		return escape_html(message.replace(/\s*in JSON at position.*/, "")) +
			"\nLine " + line_number + ", column " + column + "\n\n" +
			escape_html(line_text) + "\n" + '<span class="caret">' + caret + "</span>";
	}

	const python_words = {
		True: "true",
		False: "false",
		None: "null",
		NaN: "null",
		Infinity: "null",
		nan: "null",
		inf: "null"
	};

	const passthrough_words = {
		true: true,
		false: true,
		null: true
	};

	const word_pattern = /[A-Za-z_][A-Za-z0-9_]*(?:\s*\.\s*[A-Za-z_][A-Za-z0-9_]*)*/y;
	const prefix_pattern = /^(?:u|b|r|rb|br)$/i;
	const negative_infinity_pattern = /\s*(?:Infinity|inf)\b/y;
	const trailing_comma_pattern = /\s*[}\]]/y;
	const keyword_number_pattern = /^(?:[A-Za-z_][A-Za-z0-9_]*\s*=\s*)?(\d+)$/;
	const tzinfo_pattern = /^tzinfo\s*=/;
	const utc_pattern = /timezone\s*\.\s*utc$/;

	function pad_number(value, width) {
		return String(value).padStart(width, "0");
	}

	function skip_string(source, index) {
		const quote = source[index];
		let cursor = index + 1;
		while (cursor < source.length) {
			if (source[cursor] === "\\") {
				cursor += 2;
				continue;
			}
			if (source[cursor] === quote) {
				return cursor + 1;
			}
			cursor += 1;
		}
		return cursor;
	}

	function read_call(source, index) {
		const args = [];
		let depth = 0;
		let start = index + 1;
		let cursor = index;
		while (cursor < source.length) {
			const character = source[cursor];
			if (character === "'" || character === '"') {
				cursor = skip_string(source, cursor);
				continue;
			}
			if (character === "(" || character === "[" || character === "{") {
				depth += 1;
				cursor += 1;
				continue;
			}
			if (character === ")" || character === "]" || character === "}") {
				depth -= 1;
				if (depth === 0) {
					const tail = source.slice(start, cursor).trim();
					if (tail) {
						args.push(tail);
					}
					return { args: args, end: cursor + 1 };
				}
				cursor += 1;
				continue;
			}
			if (character === "," && depth === 1) {
				args.push(source.slice(start, cursor).trim());
				start = cursor + 1;
			}
			cursor += 1;
		}
		return null;
	}

	function time_text(numbers, offset) {
		const micro = numbers[offset + 3] || 0;
		let text = pad_number(numbers[offset] || 0, 2) + ":" + pad_number(numbers[offset + 1] || 0, 2) + ":" + pad_number(numbers[offset + 2] || 0, 2);
		if (micro) {
			text += "." + pad_number(micro, 6);
		}
		return text;
	}

	function iso_from_call(name, args) {
		const kind = name.replace(/^datetime\./, "");
		if (kind !== "datetime" && kind !== "date" && kind !== "time") {
			return null;
		}
		const numbers = [];
		let is_utc = false;
		for (let position = 0; position < args.length; position += 1) {
			const argument = args[position];
			if (tzinfo_pattern.test(argument)) {
				if (!utc_pattern.test(argument)) {
					return null;
				}
				is_utc = true;
				continue;
			}
			const match = keyword_number_pattern.exec(argument);
			if (!match) {
				return null;
			}
			numbers.push(Number(match[1]));
		}
		if (kind === "time") {
			return numbers.length ? time_text(numbers, 0) + (is_utc ? "Z" : "") : null;
		}
		if (numbers.length < 3) {
			return null;
		}
		const date = pad_number(numbers[0], 4) + "-" + pad_number(numbers[1], 2) + "-" + pad_number(numbers[2], 2);
		if (kind === "date") {
			return date;
		}
		return date + "T" + time_text(numbers, 3) + (is_utc ? "Z" : "");
	}

	function convert_call(name, args, raw) {
		const iso = iso_from_call(name, args);
		if (iso !== null) {
			return JSON.stringify(iso);
		}
		if (args.length === 1 && (args[0][0] === "'" || args[0][0] === '"') && skip_string(args[0], 0) === args[0].length) {
			return repair_python_literal(args[0]);
		}
		return JSON.stringify(raw.replace(/\s+/g, " "));
	}

	function repair_python_literal(source) {
		let out = "";
		let index = 0;

		while (index < source.length) {
			const character = source[index];

			if (character === '"') {
				out += character;
				index += 1;
				while (index < source.length) {
					const current = source[index];
					if (current === "\\") {
						out += source.slice(index, index + 2);
						index += 2;
						continue;
					}
					out += current;
					index += 1;
					if (current === '"') {
						break;
					}
				}
				continue;
			}

			if (character === "'") {
				out += '"';
				index += 1;
				while (index < source.length) {
					const current = source[index];
					if (current === "\\") {
						const next = source[index + 1];
						if (next === "'") {
							out += "'";
						} else {
							out += current + (next === undefined ? "" : next);
						}
						index += 2;
						continue;
					}
					if (current === "'") {
						out += '"';
						index += 1;
						break;
					}
					out += current === '"' ? '\\"' : current;
					index += 1;
				}
				continue;
			}

			word_pattern.lastIndex = index;
			const word = word_pattern.exec(source);
			if (word) {
				const text = word[0];
				const after_index = index + text.length;
				const after = source[after_index];
				if (prefix_pattern.test(text) && (after === "'" || after === '"')) {
					index = after_index;
					continue;
				}
				if (Object.prototype.hasOwnProperty.call(python_words, text)) {
					out += python_words[text];
					index = after_index;
					continue;
				}
				if (Object.prototype.hasOwnProperty.call(passthrough_words, text)) {
					out += text;
					index = after_index;
					continue;
				}
				let probe = after_index;
				while (probe < source.length && /\s/.test(source[probe])) {
					probe += 1;
				}
				if (source[probe] === "(") {
					const call = read_call(source, probe);
					if (call) {
						out += convert_call(text.replace(/\s+/g, ""), call.args, source.slice(index, call.end));
						index = call.end;
						continue;
					}
				}
				if (text.indexOf(".") !== -1) {
					out += JSON.stringify(text.replace(/\s+/g, ""));
					index = after_index;
					continue;
				}
				out += text;
				index = after_index;
				continue;
			}

			if (character === "-") {
				negative_infinity_pattern.lastIndex = index + 1;
				if (negative_infinity_pattern.exec(source)) {
					out += "null";
					index = negative_infinity_pattern.lastIndex;
					continue;
				}
			}

			if (character === "(" || character === ")") {
				out += character === "(" ? "[" : "]";
				index += 1;
				continue;
			}

			if (character === ",") {
				trailing_comma_pattern.lastIndex = index + 1;
				if (trailing_comma_pattern.exec(source)) {
					index += 1;
					continue;
				}
			}

			out += character;
			index += 1;
		}

		return out;
	}

	function build_leaf(key, value, is_last) {
		const line = document.createElement("div");
		line.className = "line";
		line.appendChild(gutter());
		if (key !== null) {
			line.appendChild(span("tok_key", JSON.stringify(key)));
			line.appendChild(span("punct", ": "));
		}
		line.appendChild(span(token_class(value), JSON.stringify(value)));
		if (!is_last) {
			line.appendChild(span("punct", ","));
		}
		paint_line(line);
		return line;
	}

	function build_empty(key, is_array, is_last) {
		const line = document.createElement("div");
		line.className = "line";
		line.appendChild(gutter());
		if (key !== null) {
			line.appendChild(span("tok_key", JSON.stringify(key)));
			line.appendChild(span("punct", ": "));
		}
		line.appendChild(span("punct", (is_array ? "[]" : "{}") + (is_last ? "" : ",")));
		paint_line(line);
		return line;
	}

	function build_node(key, value, is_last, depth) {
		if (value === null || typeof value !== "object") {
			return build_leaf(key, value, is_last);
		}

		const is_array = Array.isArray(value);
		const entries = is_array
			? value.map(function (item, index) { return [index, item]; })
			: Object.keys(value).map(function (name) { return [name, value[name]]; });

		if (!entries.length) {
			return build_empty(key, is_array, is_last);
		}

		const open_bracket = is_array ? "[" : "{";
		const close_bracket = is_array ? "]" : "}";
		const comma = is_last ? "" : ",";

		const node = document.createElement("div");
		node.className = "node";
		node.node_entries = entries;
		node.node_is_array = is_array;
		node.node_depth = depth;
		node.node_built = false;

		const head = document.createElement("div");
		head.className = "line";

		const toggle = document.createElement("button");
		toggle.type = "button";
		toggle.className = "fold";
		toggle.setAttribute("aria-expanded", "true");
		toggle.setAttribute("aria-label", "Fold or unfold this block");
		head.appendChild(toggle);

		if (key !== null) {
			head.appendChild(span("tok_key", JSON.stringify(key)));
			head.appendChild(span("punct", ": "));
		}
		head.appendChild(span("punct", open_bracket));

		const tail = document.createElement("span");
		tail.className = "tail";
		tail.appendChild(span("count", " " + entries.length + " " + (is_array ? "items" : "keys") + " "));
		tail.appendChild(span("punct", close_bracket + comma));
		head.appendChild(tail);

		const children = document.createElement("div");
		children.className = "children";

		const foot = document.createElement("div");
		foot.className = "line close";
		foot.appendChild(gutter());
		foot.appendChild(span("punct", close_bracket + comma));

		paint_line(head);
		paint_line(foot);

		node.appendChild(head);
		node.appendChild(children);
		node.appendChild(foot);

		const expand_now = depth < eager_depth && entries.length <= eager_width && build_credit > 0;
		if (expand_now) {
			build_credit -= entries.length;
			build_children(node);
		} else {
			node.classList.add("collapsed");
			toggle.setAttribute("aria-expanded", "false");
		}

		return node;
	}

	function build_children(node) {
		if (node.node_built) {
			return;
		}
		node.node_built = true;
		const container = node.querySelector(":scope > .children");
		const entries = node.node_entries;
		const fragment = document.createDocumentFragment();
		entries.forEach(function (entry, index) {
			const child_key = node.node_is_array ? null : entry[0];
			fragment.appendChild(build_node(child_key, entry[1], index === entries.length - 1, node.node_depth + 1));
		});
		container.appendChild(fragment);
	}

	function toggle_node(node, collapse) {
		const next = typeof collapse === "boolean" ? collapse : !node.classList.contains("collapsed");
		if (!next) {
			build_children(node);
		}
		node.classList.toggle("collapsed", next);
		const toggle = node.querySelector(":scope > .line > .fold");
		if (toggle) {
			toggle.setAttribute("aria-expanded", next ? "false" : "true");
		}
	}

	function expand_all() {
		let rounds = 0;
		let pending = output_area.querySelectorAll(".node.collapsed");
		while (pending.length && rounds < 100) {
			pending.forEach(function (node) {
				toggle_node(node, false);
			});
			rounds += 1;
			pending = output_area.querySelectorAll(".node.collapsed");
		}
	}

	function collapse_all() {
		output_area.querySelectorAll(".node").forEach(function (node) {
			toggle_node(node, true);
		});
	}

	function minified_html(value) {
		if (Array.isArray(value)) {
			const items = value.map(minified_html);
			return '<span class="punct">[</span>' + items.join('<span class="punct">,</span>') + '<span class="punct">]</span>';
		}
		if (value !== null && typeof value === "object") {
			const pairs = Object.keys(value).map(function (key) {
				return '<span class="tok_key">' + escape_html(JSON.stringify(key)) + '</span>' +
					'<span class="punct">:</span>' + minified_html(value[key]);
			});
			return '<span class="punct">{</span>' + pairs.join('<span class="punct">,</span>') + '<span class="punct">}</span>';
		}
		return '<span class="' + token_class(value) + '">' + escape_html(JSON.stringify(value)) + "</span>";
	}

	function render_empty() {
		last_output = "";
		output_area.className = "";
		output_area.innerHTML = '<span class="empty">Output appears here as you type.</span>';
		output_status.className = "status";
		output_status.textContent = "";
	}

	function sync_view_controls() {
		minify_button.textContent = view_minified ? "Beautify" : "Minify";
		sort_button.setAttribute("aria-pressed", sort_active ? "true" : "false");
		expand_button.disabled = view_minified;
		collapse_button.disabled = view_minified;
	}

	function render_output() {
		sync_view_controls();
		output_value = undefined;

		const source = input_area.value;
		const characters = source.length;
		const lines = source ? source.split("\n").length : 0;
		input_stats.textContent = characters ? lines + " lines · " + format_size(byte_size(source)) : "";

		if (!source.trim()) {
			render_empty();
			return;
		}

		let parsed;
		let repaired = false;
		try {
			parsed = JSON.parse(source);
		} catch (error) {
			let recovered = false;
			if (python_repair.checked) {
				const fixed = repair_python_literal(source);
				if (fixed !== source) {
					try {
						parsed = JSON.parse(fixed);
						recovered = true;
						repaired = true;
					} catch (repair_error) {
						recovered = false;
					}
				}
			}
			if (!recovered) {
				last_output = "";
				output_area.className = "error_box";
				output_area.innerHTML = error_report(source, error.message);
				output_status.className = "status bad";
				output_status.textContent = "Invalid JSON";
				return;
			}
		}

		if (sort_active) {
			parsed = sort_value(parsed);
		}
		output_value = parsed;

		if (view_minified) {
			last_output = JSON.stringify(parsed);
			output_area.className = "";
			output_area.innerHTML = minified_html(parsed);
			paint_line(output_area);
		} else {
			last_output = JSON.stringify(parsed, null, current_indent());
			build_credit = eager_budget;
			output_area.className = "";
			output_area.innerHTML = "";
			const tree_root = document.createElement("div");
			tree_root.className = "tree_root";
			const digits = String(last_output.split("\n").length).length;
			tree_root.style.setProperty("--numbers", (digits + 2) + "ch");
			tree_root.appendChild(build_node(null, parsed, true, 0));
			output_area.appendChild(tree_root);
		}

		output_status.className = "status ok";
		output_status.textContent = (repaired ? "Repaired · " : "Valid · ") + last_output.split("\n").length + " lines · " + format_size(byte_size(last_output));
	}

	function copy_output() {
		if (!last_output) {
			return;
		}
		const done = function () {
			const button = document.getElementById("copy_button");
			button.textContent = "Copied";
			setTimeout(function () {
				button.textContent = "Copy output";
			}, 1200);
		};
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(last_output).then(done, fallback_copy);
		} else {
			fallback_copy();
		}
		function fallback_copy() {
			const helper = document.createElement("textarea");
			helper.value = last_output;
			document.body.appendChild(helper);
			helper.select();
			document.execCommand("copy");
			document.body.removeChild(helper);
			done();
		}
	}

	function render() {
		render_output();
		refresh_search();
	}

	/*
		Search. One query runs over both panes, case-insensitive, and each pane counts its own matches.
		Input: a textarea cannot hold marks, so #input_marks sits behind it with the same text layout and holds them.
		It paints at most mark_limit marks, around the current match, and for long text it waits until typing pauses.
		Output: each line is searched as it is shown, without its indentation, so a match can run from a key
		through ": " into its value. Collapsed nodes are built only when opened, so matches are found in output_value,
		the parsed data, in the order the tree shows them. Becoming the current match opens the nodes around it.
	*/

	/*
		Text settings browsers give a textarea on their own, such as line-break on iOS or text-autospace in Chrome,
		copied onto #input_marks so both wrap text the same way. Font, line height and padding are not copied:
		both get them from one CSS rule, because a computed line height in px is rounded and drifts over long text.
	*/
	const mirrored_properties = [
		"white-space", "overflow-wrap", "word-break", "line-break", "-webkit-nbsp-mode", "text-autospace", "text-spacing-trim",
		"letter-spacing", "word-spacing", "text-indent", "text-transform", "text-rendering", "font-kerning", "font-variant-ligatures", "font-feature-settings"
	];

	/*
		The layer costs about as much to lay out as the textarea itself, so it is kept small:
		mark_limit marks at most, and when its text runs past instant_limit characters it waits for typing to pause.
	*/
	const mark_limit = 1000;
	const instant_limit = 50000;

	// Cmd + F on Apple devices, Ctrl + F elsewhere: in macOS text fields Ctrl + F moves the caret.
	const apple_keys = /Mac|iPhone|iPad|iPod/.test(navigator.platform);

	let search_pattern = null;
	let input_ranges = []; // [start, end] of every match in the input text
	let output_matches = []; // { path, part, occurrence } for every match in output_value
	let input_current = 0;
	let output_current = 0;
	let input_window = 0; // index of the first match #input_marks paints
	let input_paint_timer = 0;
	let input_current_mark = null;
	let output_current_mark = null;

	function escape_pattern(text) {
		return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
	}

	function compile_search() {
		const query = search_field.value;
		search_pattern = query ? new RegExp(escape_pattern(query), "giu") : null;
	}

	// [start, end] of every match in text.
	function find_ranges(text) {
		const ranges = [];
		if (!search_pattern) return ranges;
		search_pattern.lastIndex = 0;
		let found = search_pattern.exec(text);
		while (found) {
			ranges.push([found.index, found.index + found[0].length]);
			found = search_pattern.exec(text);
		}
		return ranges;
	}

	function marked_fragment(text, ranges) {
		const fragment = document.createDocumentFragment();
		let cursor = 0;
		ranges.forEach(function (range) {
			const mark = document.createElement("mark");
			mark.textContent = text.slice(range[0], range[1]);
			fragment.append(text.slice(cursor, range[0]), mark);
			cursor = range[1];
		});
		fragment.append(text.slice(cursor));
		return fragment;
	}

	/*
		Marks the matches of one output line: a tree line, or the whole minified output.
		Keys, values and punctuation are separate spans, so the spans a match touches are swapped for copies
		cut at the match's edges, and one mark holds the pieces of each match. The originals are kept
		in line.painted so unpaint_line can put them back. Nodes build their lines when opened, so builders call this too.
	*/
	function paint_line(line) {
		unpaint_line(line);
		if (!search_pattern) return;
		const parts = Array.from(line.children).filter(function (element) {
			return !element.matches(".gutter, .fold, .tail");
		});
		const texts = parts.map(function (part) {
			return part.textContent;
		});
		const ranges = find_ranges(texts.join(''));
		if (!ranges.length) return;

		line.painted = [];
		let run = null; // { parts, nodes }: touched spans next to each other, and what replaces them
		let mark = null;
		let mark_range = null;
		let start = 0;
		let next = 0;
		parts.forEach(function (part, index) {
			const text = texts[index];
			const end = start + text.length;
			while (next < ranges.length && ranges[next][1] <= start) next += 1;
			if (next === ranges.length || ranges[next][0] >= end) {
				run = null;
				start = end;
				return;
			}
			if (!run) {
				run = { parts: [], nodes: [] };
				line.painted.push(run);
			}
			run.parts.push(part);
			let cursor = 0;
			for (let k = next; k < ranges.length && ranges[k][0] < end; k += 1) {
				const from = Math.max(ranges[k][0] - start, 0);
				const to = Math.min(ranges[k][1] - start, text.length);
				if (from > cursor) run.nodes.push(piece(part, text.slice(cursor, from)));
				if (mark_range !== ranges[k]) {
					mark = document.createElement("mark");
					mark_range = ranges[k];
					run.nodes.push(mark);
				}
				mark.append(piece(part, text.slice(from, to)));
				cursor = to;
			}
			if (cursor < text.length) run.nodes.push(piece(part, text.slice(cursor)));
			start = end;
		});
		line.painted.forEach(function (painted) {
			painted.parts[0].before(...painted.nodes);
			painted.parts.forEach(function (part) {
				part.remove();
			});
		});
	}

	function unpaint_line(line) {
		if (!line.painted) return;
		line.painted.forEach(function (painted) {
			if (painted.nodes[0].parentNode !== line) return;
			painted.nodes[0].before(...painted.parts);
			painted.nodes.forEach(function (node) {
				node.remove();
			});
		});
		line.painted = null;
	}

	// A copy of a span, same classes, holding part of its text.
	function piece(part, text) {
		const copy = part.cloneNode(false);
		copy.textContent = text;
		return copy;
	}

	function paint_output_lines() {
		if (output_value === undefined) return;
		if (view_minified) paint_line(output_area);
		else output_area.querySelectorAll(".line").forEach(paint_line);
	}

	// Paints the window of matches that starts at input_window. Text after the last one's line cannot move a mark, so the layer stops there.
	function paint_input_marks() {
		clearTimeout(input_paint_timer);
		input_paint_timer = 0;
		const ranges = input_ranges.slice(input_window, input_window + mark_limit);
		if (!ranges.length) {
			input_marks.replaceChildren();
			return;
		}
		const text = input_area.value;
		let end = text.indexOf('\n', ranges[ranges.length - 1][1]);
		if (end === -1) end = text.length;
		input_marks.replaceChildren(marked_fragment(text.slice(0, end), ranges));
		sync_input_box();
	}

	// When the layer would hold long text, the stale marks go now and new ones are painted once typing pauses, so typing stays quick.
	function update_input_marks(scroll) {
		const last = input_ranges[Math.min(input_window + mark_limit, input_ranges.length) - 1];
		if (!last || last[1] <= instant_limit) {
			paint_input_marks();
			return;
		}
		input_marks.replaceChildren();
		clearTimeout(input_paint_timer);
		input_paint_timer = setTimeout(function () {
			paint_input_marks();
			show_search(scroll);
		}, 250);
	}

	// Moves the window when the current match is outside it, and says whether it moved.
	function frame_input_window() {
		if (input_current >= input_window && input_current < input_window + mark_limit) return false;
		input_window = Math.max(0, input_current - mark_limit / 2);
		return true;
	}

	function input_mark_at(index) {
		if (input_paint_timer || index < input_window) return null;
		return input_marks.children[index - input_window] || null;
	}

	function mirror_input_style() {
		const style = getComputedStyle(input_area);
		mirrored_properties.forEach(function (name) {
			input_marks.style.setProperty(name, style.getPropertyValue(name));
		});
	}

	// A scrollbar narrows the textarea's text, so the layer leaves the same room for it.
	function sync_input_box() {
		input_marks.style.right = (input_area.offsetWidth - input_area.clientWidth) + "px";
		sync_input_scroll();
	}

	function sync_input_scroll() {
		input_marks.scrollTop = input_area.scrollTop;
		input_marks.scrollLeft = input_area.scrollLeft;
	}

	function collect_output_matches() {
		output_matches = [];
		if (!search_pattern || output_value === undefined) return;
		if (view_minified) add_matches(last_output, [], "line");
		else collect_matches(null, output_value, [], true);
	}

	/*
		Walks the value the way build_node lays it out and writes each line's text as the tree shows it,
		so matches come in order. line is "line" for one-line entries, or "head" and "close" for a node's two lines.
	*/
	function collect_matches(key, value, path, is_last) {
		const prefix = key === null ? '' : JSON.stringify(key) + ": ";
		const comma = is_last ? '' : ',';
		if (value === null || typeof value !== "object") {
			add_matches(prefix + JSON.stringify(value) + comma, path, "line");
			return;
		}
		const names = Array.isArray(value) ? null : Object.keys(value);
		const length = names ? names.length : value.length;
		if (!length) {
			add_matches(prefix + (names ? "{}" : "[]") + comma, path, "line");
			return;
		}
		add_matches(prefix + (names ? '{' : '['), path, "head");
		for (let index = 0; index < length; index += 1) {
			path.push(index);
			if (names) collect_matches(names[index], value[names[index]], path, index === length - 1);
			else collect_matches(null, value[index], path, index === length - 1);
			path.pop();
		}
		add_matches((names ? '}' : ']') + comma, path, "close");
	}

	function add_matches(text, path, line) {
		const found = text.match(search_pattern);
		if (!found) return;
		const at = path.slice();
		for (let occurrence = 0; occurrence < found.length; occurrence += 1) {
			output_matches.push({ path: at, line: line, occurrence: occurrence });
		}
	}

	// The mark of output match index, or null while its line is not built. reveal opens the nodes needed to show it.
	function output_mark_at(index, reveal) {
		const match = output_matches[index];
		if (view_minified) return output_area.querySelectorAll(":scope > mark")[match.occurrence] || null;
		let entry = output_area.querySelector(".tree_root > *");
		for (let step = 0; entry && step < match.path.length; step += 1) {
			if (reveal) toggle_node(entry, false);
			entry = entry.node_built ? entry.querySelector(":scope > .children").children[match.path[step]] : null;
		}
		if (!entry) return null;
		// A node's closing line shows only while the node is open.
		if (reveal && match.line === "close") toggle_node(entry, false);
		let line = entry;
		if (match.line === "head") line = entry.firstElementChild;
		if (match.line === "close") line = entry.lastElementChild;
		return line.querySelectorAll(":scope > mark")[match.occurrence] || null;
	}

	function scroll_input_to(mark) {
		const top = mark.offsetTop;
		const bottom = top + mark.offsetHeight;
		if (top >= input_area.scrollTop && bottom <= input_area.scrollTop + input_area.clientHeight) return;
		input_area.scrollTop = top - (input_area.clientHeight - mark.offsetHeight) / 2;
		sync_input_scroll();
	}

	function scroll_output_to(mark) {
		const view = output_area.getBoundingClientRect();
		const box = mark.getBoundingClientRect();
		if (box.top >= view.top && box.bottom <= view.bottom) return;
		output_area.scrollTop += box.top - view.top - (view.height - box.height) / 2;
	}

	function count_label(current, total) {
		return total ? (current + 1) + " of " + total : "No matches";
	}

	function show_search(scroll) {
		if (input_current_mark) input_current_mark.classList.remove("current");
		if (output_current_mark) output_current_mark.classList.remove("current");
		input_current_mark = input_mark_at(input_current);
		output_current_mark = output_matches.length ? output_mark_at(output_current, scroll) : null;
		if (input_current_mark) input_current_mark.classList.add("current");
		if (output_current_mark) output_current_mark.classList.add("current");
		if (scroll && input_current_mark) scroll_input_to(input_current_mark);
		if (scroll && output_current_mark) scroll_output_to(output_current_mark);

		const searching = search_pattern !== null;
		input_count.textContent = searching && input_area.value ? count_label(input_current, input_ranges.length) : '';
		output_count.textContent = searching && output_value !== undefined ? count_label(output_current, output_matches.length) : '';
		input_count.classList.toggle("none", !input_ranges.length);
		output_count.classList.toggle("none", !output_matches.length);
		search_previous.disabled = !input_ranges.length && !output_matches.length;
		search_next.disabled = search_previous.disabled;
	}

	// The query changed: mark both panes again and go to the first match.
	function run_search() {
		compile_search();
		input_ranges = find_ranges(input_area.value);
		paint_output_lines();
		collect_output_matches();
		input_current = 0;
		output_current = 0;
		input_window = 0;
		update_input_marks(true);
		show_search(true);
	}

	// The input or a view option changed: keep the place in the matches, without scrolling.
	function refresh_search() {
		input_ranges = find_ranges(input_area.value);
		collect_output_matches();
		input_current = Math.min(input_current, Math.max(input_ranges.length - 1, 0));
		output_current = Math.min(output_current, Math.max(output_matches.length - 1, 0));
		frame_input_window();
		update_input_marks(false);
		show_search(false);
	}

	// Both panes step together. Each wraps around its own count.
	function step_search(direction) {
		if (input_ranges.length)
			input_current = (input_current + direction + input_ranges.length) % input_ranges.length;
		if (output_matches.length)
			output_current = (output_current + direction + output_matches.length) % output_matches.length;
		if (frame_input_window() || input_paint_timer) paint_input_marks();
		show_search(true);
	}

	output_area.addEventListener("click", function (event) {
		const toggle = event.target.closest(".fold");
		if (!toggle) {
			return;
		}
		toggle_node(toggle.closest(".node"));
		if (search_pattern) show_search(false);
	});

	expand_button.addEventListener("click", function () {
		expand_all();
		if (search_pattern) show_search(false);
	});
	collapse_button.addEventListener("click", collapse_all);

	search_field.addEventListener("input", run_search);

	search_field.addEventListener("keydown", function (event) {
		if (event.isComposing) return;
		if (event.key === "Enter") {
			event.preventDefault();
			step_search(event.shiftKey ? -1 : 1);
			return;
		}
		if (event.key !== "Escape") return;
		event.preventDefault();
		if (!search_field.value) {
			search_field.blur();
			return;
		}
		search_field.value = '';
		run_search();
	});

	search_previous.addEventListener("click", function () {
		step_search(-1);
	});

	search_next.addEventListener("click", function () {
		step_search(1);
	});

	// A second press, from the search field, opens the browser's own find.
	document.addEventListener("keydown", function (event) {
		const command = apple_keys ? event.metaKey : event.ctrlKey;
		if (!command || event.altKey || event.shiftKey || event.key.toLowerCase() !== 'f') return;
		if (document.activeElement === search_field) return;
		event.preventDefault();
		search_field.focus();
		search_field.select();
	});

	input_area.addEventListener("scroll", sync_input_scroll);
	new ResizeObserver(sync_input_box).observe(input_area);

	input_area.addEventListener("input", function () {
		render();
	});

	indent_select.addEventListener("change", function () {
		apply_indent_width();
		render();
	});

	sort_button.addEventListener("click", function () {
		sort_active = !sort_active;
		render();
	});

	python_repair.addEventListener("change", function () {
		render();
	});

	minify_button.addEventListener("click", function () {
		view_minified = !view_minified;
		render();
	});

	document.getElementById("copy_button").addEventListener("click", copy_output);

	document.getElementById("clear_button").addEventListener("click", function () {
		input_area.value = "";
		input_area.focus();
		view_minified = false;
		render();
	});

	document.getElementById("sample_button").addEventListener("click", function () {
		input_area.value = '{"name":"orders","count":2,"active":true,"owner":null,"items":[{"sku":"A-19","qty":3,"price":12.5,"tags":["new","sale"]},{"sku":"B-04","qty":1,"price":249.99,"tags":[]}]}';
		render();
	});

	input_area.addEventListener("keydown", function (event) {
		if (event.key === "Tab") {
			event.preventDefault();
			const start = input_area.selectionStart;
			const end = input_area.selectionEnd;
			input_area.value = input_area.value.slice(0, start) + "\t" + input_area.value.slice(end);
			input_area.selectionStart = start + 1;
			input_area.selectionEnd = start + 1;
			render();
		}
	});

	["dragenter", "dragover"].forEach(function (name) {
		input_pane.addEventListener(name, function (event) {
			event.preventDefault();
			input_pane.classList.add("drop_active");
		});
	});

	["dragleave", "drop"].forEach(function (name) {
		input_pane.addEventListener(name, function () {
			input_pane.classList.remove("drop_active");
		});
	});

	input_pane.addEventListener("drop", function (event) {
		event.preventDefault();
		const file = event.dataTransfer.files[0];
		if (!file) {
			return;
		}
		const reader = new FileReader();
		reader.onload = function () {
			input_area.value = reader.result;
			render();
		};
		reader.readAsText(file);
	});

	apply_indent_width();
	mirror_input_style();
	render();
</script>

</body>
</html>
